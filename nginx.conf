# ReceiptBuddy API Gateway — reverse proxy with CORS at server + location level.
# Server-level add_header(always) covers errors (502) + proxy responses.
# OPTIONS handled in each location block (where 'if'+'add_header' works).
# Upstream CORS stripped via proxy_hide_header to avoid duplication.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    client_max_body_size 20M;

    # Docker DNS resolver — required for proxy_pass with variables ($request_uri)
    resolver 127.0.0.11 valid=10s;

    # ─── SERVER-LEVEL CORS — covers ALL responses (502, 404, proxy replies) ───
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 8000;
        server_name localhost;

        # ─── AUTH ──────────────────────────────────
        location /api/auth/ {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_pass http://auth:8001/api/auth/;
        }

        # ─── FINANCE ───────────────────────────────
        location ~ ^/api/(receipts|expenses|inventory|invoices|expense-categories)(/.*)?$ {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_pass http://finance:8002$request_uri;
        }

        # ─── HR ────────────────────────────────────
        location ~ ^/api/(employees|attendance|leave|shifts?)(/.*)?$ {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_pass http://hr:8003$request_uri;
        }

        # ─── INTELLIGENCE ──────────────────────────
        location ~ ^/api/(ai|analytics|reports)(/.*)?$ {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_pass http://intelligence:8004$request_uri;
        }

        # ─── STORAGE (MinIO proxy) ────────────────────
        location /api/storage/ {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            if ($request_method = OPTIONS) { return 204; }
            rewrite ^/api/storage/(.*) /receipts/$1 break;
            proxy_pass http://minio:9000;
            proxy_set_header Host minio:9000;
        }

        # ─── HEALTH ────────────────────────────────
        location /health {
            default_type application/json;
            return 200 '{"status":"healthy","service":"gateway"}';
        }

        # ─── FALLBACK ─────────────────────────────
        location / {
            default_type application/json;
            return 404 '{"error":"Route not found in API Gateway"}';
        }
    }
}
